const pad=n=>String(n).padStart(2,'0');

function addDays(iso,n){const [y,m,d]=iso.split('-').map(Number);const t=new Date(y,m-1,d+n);return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());}
function addMonths(iso,n){const [y,m,d]=iso.split('-').map(Number);const last=new Date(y,m-1+n+1,0).getDate();const t=new Date(y,m-1+n,Math.min(d,last));return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());}
function diffDays(a,b){const p=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};return Math.round((p(b)-p(a))/86400000);}

async function doAuth(){const mail=$('auMail').value.trim().toLowerCase(),pw=$('auPass').value,su=AUTH==='signup';const say=t=>{$('auMsg').textContent=t;};
  if(!mail.includes('@'))return say('Email non valida');if(pw.length<6)return say('La password deve avere almeno 6 caratteri');
  if(su&&pw!==$('auPass2').value)return say('Le due password non sono uguali');
  const b=$('auBtn');b.disabled=true;b.textContent='Attendi…';say('');
  try{const r=su?await SB.auth.signUp({email:mail,password:pw}):await SB.auth.signInWithPassword({email:mail,password:pw});
    if(r.error)throw r.error;
    if(!r.data.session){AUTH='login';vLogin();$('auMsg').textContent='Account creato. Apri la tua email, premi il link di conferma, poi torna qui e premi « Entra ».';return;}
    USER=r.data.session.user;await loadAll();}
  catch(e){const m=String(e&&e.message||'');b.disabled=false;b.textContent=su?'Crea il mio account':'Entra';
    say(/already|registered|exists/i.test(m)?'Questo account esiste già: premi « Entra »':/invalid login|credentials/i.test(m)?'Email o password sbagliata':/not confirmed/i.test(m)?'Prima conferma l\'email (guarda nella tua casella di posta)':errMsg(e));}}

function renderList(){const el=$('list');if(!el)return;
  let shown=ROWS.map(c=>({c,s:status(c)}));
  if(filter==='sollecitare')shown=shown.filter(x=>daSoll(x.s));
  else if(filter==='attivi')shown=shown.filter(x=>x.s.k==='attivi'||x.s.k==='scadono');
  else if(filter==='prova')shown=shown.filter(x=>x.s.k==='prova');
  else if(filter==='bloccati')shown=shown.filter(x=>x.s.k==='bloccati');
  const qq=q.trim().toLowerCase(),qd=qq.replace(/\D/g,'');
  if(qq)shown=shown.filter(x=>nome(x.c).toLowerCase().includes(qq)||(x.c.owner||'').toLowerCase().includes(qq)||(x.c.shop_id||'').toLowerCase().includes(qq)||(qd.length>=3&&String(x.c.phone||'').includes(qd)));
  const order={bloccati:0,ritardo:1,scadono:2,prova:3,attivi:4};
  shown.sort((a,b)=>order[a.s.k]-order[b.s.k]||a.s.end.localeCompare(b.s.end));
  el.innerHTML=shown.length?shown.map(x=>'<button class="cli" style="--stripe:'+x.s.stripe+'" data-act="open" data-id="'+x.c.user_id+'"><div class="main"><div class="t">'+esc(nome(x.c))+'</div><div class="s">'+esc(fphone(x.c.phone))+(x.c.owner?' · '+esc(x.c.owner):'')+(x.c.shop_id?' · <span class="mono">'+esc(x.c.shop_id)+'</span>':'')+(fNom(x.c)?' · <b>'+fNom(x.c)+'</b>':'')+'</div></div><div class="right"><span class="chip '+x.s.cls+'">'+x.s.label+'</span><div class="d">fino al '+fdate(x.s.end)+'</div></div></button>').join('')
    :'<div class="empty">'+(ROWS.length?C_().notFound:C_().empty)+'</div>';}

        :isR()?await SB.rpc('resto_enregistrer_paiement',{p_user:id,p_months:months,p_days:days,p_amount:amount,p_mode:mode,p_formule:formule||''})
              :await SB.rpc('enregistrer_paiement',{p_user:id,p_months:months,p_days:days,p_amount:amount,p_mode:mode});

    el.dataset.arm='';el.textContent='🔑 Nuova password';return;}
  if(a==='delAcc'){const c=cli(el.dataset.id);const st=+(el.dataset.arm||0);
    if(st===0){el.dataset.arm='1';$('accZone').innerHTML='<div class="notice stack" style="margin-top:10px"><b>Eliminare l\'account di '+esc(nome(c))+'?</b><span class="small">Si cancellano per sempre i suoi dati, i suoi clienti e i suoi pagamenti. Non si può tornare indietro.</span><button class="btn danger" data-act="delAcc" data-id="'+el.dataset.id+'" data-arm="1">Sì, elimina per sempre</button></div>';return;}
    el.disabled=true;el.textContent='Elimino…';const r=await navRpc('seck_pan_supprimer',{p_user:c.user_id});
    if(r.error){el.disabled=false;el.textContent='Sì, elimina per sempre';return toast(/Could not find|does not exist|schema cache/i.test(r.error.message)?'Manca il passo su Supabase: incolla seck-comptes.sql → Run':errMsg(r.error));}
    closeSheet();openId=null;await loadAll();return toast('Account eliminato');}
  if(a==='mon'){readPay();const c=cli(payDraft.id);payDraft.months=+el.dataset.m;payDraft.amount=String((isF()?FORMULE[payDraft.formule].prix:(c.price||0))*payDraft.months);openClient(c.user_id);return;}
  if(a==='form'){readPay();const c=cli(payDraft.id);payDraft.formule=el.dataset.f2;payDraft.amount=String(FORMULE[payDraft.formule].prix*payDraft.months);openClient(c.user_id);return;}
  if(a==='app'){APP=el.dataset.a;try{localStorage.setItem(AKEY,APP);}catch(err){}filter='tutti';q='';closeSheet();ROWS=[];PAYS=[];return loadAll();}
  if(a==='pay'){readPay();const amt=Math.round(num(payDraft.amount));if(amt<=0)return toast('Scrivi l\'importo ricevuto');return rpcPay(el.dataset.id,payDraft.months,0,amt,payDraft.mode,el,payDraft.formule);}
  if(a==='gift'){const d=Math.round(num($('gDays').value));if(d<=0||d>366)return toast('Numero di giorni non valido');return rpcPay(el.dataset.id,0,d,0,'Regalo '+d+' g',el);}
  if(a==='askUndo'){$('un'+el.dataset.p).innerHTML='<button class="btn sm danger" data-act="undo" data-p="'+el.dataset.p+'">Sicuro?</button>';return;}
  if(a==='undo'){el.disabled=true;const id=openId;const r=isN()?await navRpc(APP+'_pan_undo',{p_id:+el.dataset.p}):await SB.rpc(C_().undo,{p_id:+el.dataset.p});if(r.error){el.disabled=false;return toast(errMsg(r.error));}await loadAll();if(id)openClient(id);toast('Pagamento annullato');return;}
  if(a==='navForget'){NAVPW='';try{localStorage.removeItem(NPKEY);}catch(err){}return loadAll();}
  if(a==='saveNum'){const n=$('myNum').value.trim(),wa=$('myWa').value.trim();if(n.replace(/\D/g,'').length<9)return toast('Numero non valido');TUO_WAVE=n;MY_WA=wa||n;try{localStorage.setItem(NKEY,JSON.stringify({wave:TUO_WAVE,wa:MY_WA}));}catch(err){}toast('Numero salvato');return;}
  if(a==='cfgCopy')return copyText(JSON.stringify({whatsapp:waNum(MY_WA),paiement:TUO_WAVE,prix:PREZZO_BASE.toLocaleString('fr-FR').replace(/\s/g,' ')+' F',nom:TUO_NOME},null,1));
});

// ===== Avvisi sul telefono : nuove iscrizioni (tutte le app) e nuove attività =====
const ADM_PUB='BLcHXOxXIRWkIBKizjrAQ0pRpNURUxUGiIlzYgHCGH-aAKLeiGsoL_thiuzOrPAUaF6lWhgOtBFTajqAcmO6sB8',ADM_KEY='pannelloSeck.push';
const admIOS=()=>/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const admHome=()=>!!(navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches));
const admOk=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
function admB64(s){s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const r=atob(s);return Uint8Array.from(r,c=>c.charCodeAt(0));}
let ADM_BUSY=false;
function admOnFlag(){try{return localStorage.getItem(ADM_KEY)==='1'&&admOk()&&Notification.permission==='granted';}catch(e){return false;}}
function admCard(){let t;
  if(admOnFlag())t='<b>🔔 Avvisi attivi su questo telefono</b><div class="admnote">Ti arriva un avviso a ogni nuova iscrizione (tutte le app) e quando un cliente aggiunge un\'attività.</div><button class="admbtn ghost" id="admTest" type="button">Manda un avviso di prova</button>';
  else if(admIOS()&&!admHome())t='<b>🔔 Avvisi delle nuove iscrizioni</b><div class="admnote">Su iPhone: in Safari tocca <b>Condividi</b> (il quadrato con la freccia) → <b>Aggiungi alla schermata Home</b>. Poi apri il pannello da quella icona e torna qui.</div>';
  else if(!admOk())t='<b>🔔 Avvisi delle nuove iscrizioni</b><div class="admnote">Questo browser non riceve avvisi. Usa Safari dalla schermata Home (iPhone) o Chrome (Android).</div>';
  else t='<b>🔔 Avvisi delle nuove iscrizioni</b><div class="admnote">Ricevi un avviso su questo telefono quando qualcuno si iscrive a una delle tue app, anche con il pannello chiuso.</div><button class="admbtn" id="admOn" type="button"'+(ADM_BUSY?' disabled':'')+'>'+(ADM_BUSY?'Attendi…':'Attiva gli avvisi')+'</button>';
  return '<div class="admcard" id="admCard">'+t+'</div>';}
function admPaint(){const c=$('admCard');if(c)c.outerHTML=admCard();}
async function admEnable(){if(ADM_BUSY)return;ADM_BUSY=true;admPaint();
  try{const perm=await Notification.requestPermission();if(perm!=='granted'){toast('Notifiche rifiutate: attivale nelle Impostazioni del telefono');throw 0;}
    const reg=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;
    let s=await reg.pushManager.getSubscription();if(!s)s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:admB64(ADM_PUB)});
    const r=await navRpc('seck_admin_push_save',{p_sub:s.toJSON()});if(r.error)throw r.error;
    try{localStorage.setItem(ADM_KEY,'1');}catch(e){}toast('Avvisi attivati ✅ Ti arriva un avviso di prova');navRpc('seck_admin_push_test');}
  catch(e){if(e)toast('Non riesco ad attivare gli avvisi. Riprova.');}
  ADM_BUSY=false;admPaint();}
document.addEventListener('click',e=>{const b=e.target.closest('#admOn,#admTest');if(!b)return;
  if(b.id==='admOn')admEnable();else navRpc('seck_admin_push_test').then(r=>toast(r.error?errMsg(r.error):'Avviso di prova inviato'));});
{const _r=render;render=function(){const x=_r.apply(this,arguments);try{if(VIEW==='main'&&NAVPW&&!$('admCard')){const a=$('app'),w=a&&(a.querySelector('.wrap')||a);if(w)w.insertAdjacentHTML('beforeend',admCard());}}catch(e){}return x;};}
// se gli avvisi erano attivi, rinnova l'iscrizione in silenzio (dopo aggiornamenti del telefono)
setTimeout(async()=>{try{if(!admOnFlag()||!NAVPW)return;const reg=await navigator.serviceWorker.register('sw.js');const s=await reg.pushManager.getSubscription();if(s)navRpc('seck_admin_push_save',{p_sub:s.toJSON()});}catch(e){}},4000);
boot();
